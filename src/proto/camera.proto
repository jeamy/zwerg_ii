syntax = "proto3";

package dwarf;

// Kamera öffnen
message ReqOpenCamera {
  bool binning = 1;           // Binning aktivieren
  int32 rtsp_encode_type = 2; // 0: 4K, 1: 1080p
}

// Foto aufnehmen
message ReqPhoto {
}

// Serienaufnahme starten
message ReqBurst {
  int32 count = 1;  // Anzahl Aufnahmen
}

// Video starten
message ReqStartRecord {
}

// Video stoppen
message ReqStopRecord {
}

// Alle Parameter setzen
message ReqSetAllParams {
  int32 exp_mode = 1;        // 0: Auto, 1: Manuell
  int32 exp_index = 2;       // Belichtungs-Index
  int32 gain_mode = 3;       // Verstärkungs-Modus
  int32 gain_index = 4;      // Verstärkungs-Index
  int32 ircut_value = 5;     // 0: CUT, 1: PASS
  int32 wb_mode = 6;         // 0: Auto, 1: Manuell
  int32 wb_index_type = 7;   // 0: Farbtemperatur, 1: Szene
  int32 wb_index = 8;        // Weißabgleich-Index
  int32 brightness = 9;      // Helligkeit (0-255)
  int32 contrast = 10;       // Kontrast (0-255)
  int32 hue = 11;            // Farbton (0-255)
  int32 saturation = 12;     // Sättigung (0-255)
  int32 sharpness = 13;      // Schärfe (0-100)
  int32 jpg_quality = 14;    // JPG-Qualität
}

// Alle Parameter abrufen
message ReqGetAllParams {
}

// Einzelner Parameter in der Antwort
message CommonParam {
  bool has_auto = 1;      // Hat automatischen Modus
  int32 auto_mode = 2;    // 0: Auto, 1: Manuell
  int32 id = 3;           // Parameter-ID
  int32 mode_index = 4;   // Modus-Index
  int32 index = 5;        // Wert-Index
  double continue_value = 6; // Kontinuierlicher Wert
}

// Response mit allen Parametern (offizielles Format)
message ResGetAllParams {
  repeated CommonParam all_params = 1;
  int32 code = 2;
}

// Einzelne Parameter-Setter
message ReqSetExpMode {
  int32 mode = 1;  // 0: Auto, 1: Manual
}

message ReqSetExp {
  int32 index = 1;  // Exposure index
}

message ReqSetGainMode {
  int32 mode = 1;  // 0: Auto, 1: Manual
}

message ReqSetGain {
  int32 index = 1;  // Gain index
}

message ReqSetBrightness {
  int32 value = 1;  // B = (A + 100) * 255.0 / 200
}

message ReqSetContrast {
  int32 value = 1;  // B = (A + 100) * 255.0 / 200
}

message ReqSetSaturation {
  int32 value = 1;  // B = (A + 100) * 255.0 / 200
}

message ReqSetHue {
  int32 value = 1;  // B = (A + 180) * 255.0 / 360
}

message ReqSetSharpness {
  int32 value = 1;  // 0-100
}

message ReqSetIRCut {
  int32 value = 1;  // 0: CUT, 1: PASS
}

message ReqSetWBMode {
  int32 mode = 1;  // 0: Auto, 1: Manual
}

// Zeitraffer starten
message ReqStartTimelapsePhoto {
  int32 interval = 1;  // Intervall in Sekunden
  int32 count = 2;     // Anzahl Aufnahmen
}

// System-Status
message ResSystemWorkingState {
  int32 code = 1;
  int32 state = 2;  // Aktueller Status
}

// Set feature parameters (CMD 10037)
// Used to set panorama rows (id=6) and cols (id=7) before starting panorama
message ReqSetFeatureParams {
  CommonParam param = 1;
}

// Get all feature parameters (CMD 10038)
message ReqGetAllFeatureParams {
}

message ResGetAllFeatureParams {
  repeated CommonParam all_feature_params = 1;
  int32 code = 2;
}
