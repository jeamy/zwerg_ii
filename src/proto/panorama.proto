syntax = "proto3";

package dwarf;

// Panorama messages

message ReqStartPanoramaByGrid {
    uint32 rows = 1;
    uint32 cols = 2;
    // Motor parameters (from dwarfii_api)
    uint32 mStep1 = 3;      // Motor step: 1, 2, 4, 8, 16, 32, 64, 128, 256
    uint32 mStep2 = 4;
    uint32 speed1 = 5;      // Speed: 0-1000*mStep
    uint32 speed2 = 6;
    uint32 pulse1 = 7;      // Pulse: >=2
    uint32 pulse2 = 8;
    uint32 accelStep1 = 9;  // Accel: 0-1000
    uint32 accelStep2 = 10;
}

message ReqStopPanorama {
}

// Notification: Panorama progress (CMD 15219)
message ResNotifyPanoramaProgress {
    int32 total_count = 1;      // Total number of photos to take
    int32 completed_count = 2;  // Number of photos completed
}
